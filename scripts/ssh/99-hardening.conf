# /etc/ssh/sshd_config.d/99-hardening.conf
# Keys only, no root password logins. Check effective values with:  sshd -T | grep -Ei 'passw|root|kbd'
# NOTE: sshd uses the FIRST value it sees for a key. If an earlier file (e.g. 50-cloud-init.conf)
# sets PasswordAuthentication yes, rename this file to 00-hardening.conf or fix that file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin prohibit-password
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# Optional: only these users may log in at all
# AllowUsers deploy alice agents
