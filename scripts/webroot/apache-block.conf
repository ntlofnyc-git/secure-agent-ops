# /etc/apache2/conf-available/blockjunk.conf  ->  a2enconf blockjunk && apachectl configtest && systemctl reload apache2
# Applies to every vhost on the box. (Or paste into a single vhost / .htaccess.)
<FilesMatch "(?i)(\.(bak.*|orig|old|save|swp|sql|sql\.gz|dump|tar|tar\.gz|tgz|log|ini|conf)|~)$">
    Require all denied
</FilesMatch>
<FilesMatch "(?i)^(\.env.*|wp-config\.php\..+|composer\.(json|lock))$">
    Require all denied
</FilesMatch>
RedirectMatch 404 "/\.git(/|$)"
