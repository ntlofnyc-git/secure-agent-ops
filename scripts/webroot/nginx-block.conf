# /etc/nginx/snippets/blockjunk.conf  ->  `include snippets/blockjunk.conf;` inside EVERY server {} block
# nginx -t && systemctl reload nginx
location ~* (\.(bak[^/]*|orig|old|save|swp|sql|sql\.gz|dump|tar|tar\.gz|tgz|log|ini|conf)$|~$|/\.env[^/]*$|/\.git(/|$)|/\.ht|/wp-config\.php\..+$|/composer\.(json|lock)$) {
    return 404;
}
