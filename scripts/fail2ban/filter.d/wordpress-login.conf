# /etc/fail2ban/filter.d/wordpress-login.conf
# Catches, per client IP in combined access logs:
#   - password guessing:      POST /wp-login.php
#   - xmlrpc multicall abuse: POST /xmlrpc.php
#   - reset-form floods:      /wp-login.php?action=lostpassword
#   - user enumeration:       /wp-json/wp/v2/users  and  /?author=N
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /(?:[^ "]*/)?wp-login\.php[^"]*" (?:200|302|403|429)
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /(?:[^ "]*/)?xmlrpc\.php[^"]*"
            ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|POST) /(?:[^ "]*/)?wp-login\.php\?action=lostpassword[^"]*"
            ^<HOST> \S+ \S+ \[[^\]]+\] "GET /(?:[^ "]*/)?(?:wp-json/wp/v2/users|\?rest_route=/wp/v2/users)[^"]*"
            ^<HOST> \S+ \S+ \[[^\]]+\] "GET /(?:[^ "]*/)?\?author=\d+[^"]*"
ignoreregex =
# Test before enabling:
#   fail2ban-regex /var/log/apache2/access.log /etc/fail2ban/filter.d/wordpress-login.conf
